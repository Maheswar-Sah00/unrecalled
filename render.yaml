# Render Blueprint: one free web service (long-running Node server) backed by
# a hosted Postgres such as Neon. Render > New > Blueprint > pick this repo.
# You are asked for the two `sync: false` values on first deploy.
services:
  - type: web
    name: unrecalled
    runtime: node
    plan: free
    branch: master
    autoDeploy: true
    # Dev dependencies are needed for the build, so NODE_ENV is set only at start.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # The framework reads APP_URL for agent chat stream tokens and background
    # self-calls; Render provides the public URL as RENDER_EXTERNAL_URL.
    # The heap cap leaves room for native memory on the free 512 MB instance
    # (the server idles at about 160 MB).
    startCommand: APP_URL="${APP_URL:-$RENDER_EXTERNAL_URL}" NODE_ENV=production node --max-old-space-size=320 .output/server/index.mjs
    healthCheckPath: /_agent-native/ping
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NITRO_PRESET
        value: node-server
      # Public demo: no sign-in, every visitor shares one demo account.
      - key: AUTH_DISABLED
        value: "1"
      - key: APP_NAME
        value: unrecalled
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AGENT_ENGINE
        value: ai-sdk:google
      - key: AGENT_MODEL
        value: gemini-3.5-flash
      # Paste these two in the Render dashboard; never commit them.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
